<header class="site-header wrap">
  <div class="site-header__top">
    <a href="{{ '/' | relative_url }}" class="site-name">Shibaprasad Bhattacharya</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
  </div>
  <nav class="site-nav" aria-label="Main">
    <a class="plain-link{% if page.layout == 'post' or page.layout == 'tag' %} is-active{% endif %}" href="{{ '/blog.html' | relative_url }}"{% if page.url == '/blog.html' %} aria-current="page"{% endif %}>Essays</a>
    <a class="plain-link" href="{{ site.scholar_url }}" target="_blank" rel="noopener">Google Scholar <span aria-hidden="true">↗</span></a>
    <a class="plain-link" href="{{ '/subscribe.html' | relative_url }}"{% if page.url == '/subscribe.html' %} aria-current="page"{% endif %}>Subscribe</a>
  </nav>
</header>
